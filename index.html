<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendWise Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
<header><h1>SpendWise Dashboard</h1><p id="transactionCount">0 transactions</p></header>
<div class="stats">
<div class="card"><h3>Monthly Spend</h3><p id="monthlySpend">KES 0</p></div>
<div class="card"><h3>Remaining</h3><p id="remainingBudget">KES 50,000</p></div>
</div>
<section class="form-section">
<h2>Add New Transaction</h2>
<form id="transactionForm">
<input type="text" id="desc" placeholder="Description" required>
<select id="category" required>
<option value="">Category</option>
<option value="Food">Food</option>
<option value="Transport">Transport</option>
<option value="Shopping">Shopping</option>
<option value="Bills">Bills</option>
<option value="Income">Income</option>
</select>
<input type="number" id="amount" placeholder="Amount KES" required>
<select id="type" required>
<option value="expense">Expense</option>
<option value="income">Income</option>
</select>
<button type="submit">Add Transaction</button>
</form>
</section>
<section><h2>Recent Transactions</h2><ul id="transactionList"></ul></section>
</div>
<script src="script.js"></script>
</body>
</html>
